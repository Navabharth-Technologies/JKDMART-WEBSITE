<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon - JKD Mart App</title>
    <link rel="icon" type="image/png" href="assets/logo.png">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Using existing global styles -->
    <link rel="stylesheet" href="style.css?v=2">

    <style>
        body {
            background-color: #020617;
            color: white;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Abstract glowing background effect */
        .glow-bg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 60vw;
            height: 60vw;
            background: radial-gradient(circle, rgba(147, 92, 211, 0.15) 0%, rgba(2, 6, 23, 0) 70%);
            z-index: 0;
            animation: pulse 4s infinite alternate;
        }

        @keyframes pulse {
            0% { transform: translate(-50%, -50%) scale(0.8); opacity: 0.5; }
            100% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
        }

        .coming-soon-container {
            position: relative;
            z-index: 1;
            text-align: center;
            max-width: 600px;
            padding: 2rem;
        }

        .cs-logo {
            height: 100px;
            margin-top: 2rem;
            margin-bottom: 2rem;
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
            100% { transform: translateY(0px); }
        }

        .cs-title {
            font-family: 'Outfit', sans-serif;
            font-size: 3.5rem;
            font-weight: 700;
            margin-bottom: 1rem;
            line-height: 1.2;
        }

        .cs-subtitle {
            font-size: 1.2rem;
            color: var(--text-muted);
            margin-bottom: 2.5rem;
            line-height: 1.6;
        }

        .notify-container {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            align-items: center;
            margin-top: 2rem;
        }

        .notify-input {
            padding: 1rem 1.5rem;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05);
            color: white;
            width: 100%;
            max-width: 350px;
            font-size: 1rem;
            font-family: 'Inter', sans-serif;
            outline: none;
            transition: all 0.3s ease;
        }

        .notify-input:focus {
            border-color: #935CD3;
            background: rgba(255, 255, 255, 0.1);
        }

        .notify-btn {
            padding: 1rem 2.5rem;
            border-radius: 50px;
            border: none;
            background: linear-gradient(135deg, #935CD3 0%, #E836A3 100%);
            color: white;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(147, 92, 211, 0.3);
        }

        .notify-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(147, 92, 211, 0.5);
        }
        
        .back-btn {
            display: inline-block;
            margin-top: 3rem;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.3s ease;
        }
        
        .back-btn:hover {
            color: white;
        }
        
        .back-btn i {
            margin-right: 0.5rem;
        }
    </style>
</head>
<body>
    <div class="glow-bg"></div>
    <div class="coming-soon-container">
        <img src="assets/logo.png" alt="JKD Mart Logo" class="cs-logo">
        <h1 class="cs-title">Something <span class="text-gradient">Awesome</span> is Coming.</h1>
        <p class="cs-subtitle">We are working hard to build the ultimate B2B app experience for vendors and retailers. Stay tuned!</p>
        
        <form id="notify-form" class="notify-container">
            <input type="text" id="name-input" name="name" class="notify-input" placeholder="Enter your full name" required>
            <input type="tel" id="phone-input" name="phone" class="notify-input" placeholder="Enter your phone number" required>
            <input type="email" id="email-input" name="email" class="notify-input" placeholder="Enter your email address" required>
            <button type="submit" id="notify-submit-btn" class="notify-btn">Notify Me</button>
        </form>
        
        <div id="form-message" style="display: none; margin-top: 1rem; font-size: 0.9rem;"></div>
        
        <a href="javascript:window.close();" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Go Back</a>
    </div>

    <script>
        const form = document.getElementById('notify-form');
        const submitBtn = document.getElementById('notify-submit-btn');
        const messageDiv = document.getElementById('form-message');

        // PLACEHOLDER: You will replace this with your Google Apps Script Web App URL later
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbza-2RO2bq5-nlXN7v1iktBtVYE3uguODoBS5a0V_HfvJxbUU97gYt4clx8DbkLZ7tA/exec'; 

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const name = document.getElementById('name-input').value;
            const phone = document.getElementById('phone-input').value;
            const email = document.getElementById('email-input').value;
            
            if (!email || !name || !phone) return;

            // UI update: Loading state
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Submitting...';
            messageDiv.style.display = 'none';

            try {
                // To submit to Google Sheets, we send a POST request with the data
                // Note: 'no-cors' is often needed to bypass CORS issues with Google Apps Script
                const formData = new FormData();
                formData.append('name', name);
                formData.append('phone', phone);
                formData.append('email', email);

                if (GOOGLE_SCRIPT_URL === 'YOUR_GOOGLE_SCRIPT_WEB_APP_URL_HERE') {
                    throw new Error('Please provide the Google Sheet connection URL first!');
                }

                const response = await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    body: formData,
                    mode: 'no-cors' // Google Script requires this for cross-origin requests from browsers
                });

                // Success
                form.reset();
                messageDiv.style.display = 'block';
                messageDiv.style.color = '#4ade80'; // Success green
                messageDiv.innerHTML = '<i class="fa-solid fa-check-circle"></i> Thanks! We will notify you when we launch.';
            } catch (error) {
                // Error
                messageDiv.style.display = 'block';
                messageDiv.style.color = '#f87171'; // Error red
                if (error.message.includes('URL first')) {
                    messageDiv.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i> ' + error.message;
                } else {
                    messageDiv.innerHTML = '<i class="fa-solid fa-circle-xmark"></i> Oops! Something went wrong. Please try again.';
                }
            } finally {
                // Reset button state
                submitBtn.disabled = false;
                submitBtn.innerHTML = 'Notify Me';
            }
        });
    </script>
</body>
</html>
